<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeFit - ATS Checker</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

<div class="top">RESUME<span>FIT</span> - Free ATS Checker</div>

<div class="main">
  <h1>Free ATS Resume Checker</h1>
  <p>Upload your resume PDF only</p>

  <div class="box">
    <div id="drop">
      <b>Click Here to Upload Resume (PDF Only)</b>
      <small>We will check if it's a real resume</small>
      <input type="file" id="file" hidden accept="application/pdf,.pdf">
    </div>
    <div id="err"></div>
    <div id="load">Reading file... please wait</div>
    <div id="out">
      <h2>ATS Score: <span id="sc">0%</span></h2>
      <div class="bar-bg"><div id="bar"></div></div>
      <div id="checks"></div>
      <small id="fname"></small>
    </div>
  </div>
</div>

<footer>
  <p class="d1">2026@khalilullahsheriff</p>
  <p class="d2">Developer: khalilullahsheriff | Since 2026</p>
</footer>

<script src="script.js"></script>
</body>
</html>
